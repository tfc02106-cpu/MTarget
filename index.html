<!DOCTYPE html>
<html lang="zh-Hant" data-theme="lab">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重複性靶心｜5 人 × 5 次量測</title>
<style>
html[data-theme="lab"]{
  --paper:#EEF2F5; --surface:#FFFFFF; --ink:#12303F; --ink-soft:#5A7183;
  --rule:#C6D4DE; --rule-soft:#E3EAF0; --accent:#0E6BA8; --accent-soft:#E2EDF6;
  --ok:#1E6F50; --flag:#A82C22; --ring-in:#F7E4E1; --ring-mid:#EDF2F7;
}
html[data-theme="blueprint"]{
  --paper:#0C2132; --surface:#13324A; --ink:#DFEAF3; --ink-soft:#93AFC4;
  --rule:#2B5674; --rule-soft:#1D4360; --accent:#57C4E8; --accent-soft:#1B3F59;
  --ok:#6FD3A6; --flag:#FF9482; --ring-in:#26455C; --ring-mid:#1A3A52;
}
html[data-theme="contrast"]{
  --paper:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --ink-soft:#26323A;
  --rule:#000000; --rule-soft:#9AA6AD; --accent:#0033CC; --accent-soft:#E3E9FF;
  --ok:#00591F; --flag:#A80000; --ring-in:#F0F0F0; --ring-mid:#FAFAFA;
}
*{box-sizing:border-box}
html{font-size:calc(17px * var(--s,1))}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.65;letter-spacing:.01em;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:.02em}

.ticks{height:13px;background:repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 9px);opacity:.6}
.ticks.tall{height:19px;background:
  repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 9px),
  repeating-linear-gradient(to right,var(--accent) 0 1.5px,transparent 1.5px 45px)}

header{background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{margin:0;font-size:1.32rem;font-weight:700}
.subject{color:var(--ink-soft);font-size:.95rem;flex:1;min-width:200px}
.switches{display:flex;gap:6px}
.switches button{font-size:.82rem;padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft);font-family:inherit}
.switches button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

main{max-width:1240px;margin:0 auto;padding:22px 20px 40px;
  display:grid;grid-template-columns:minmax(0,25rem) minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr;gap:20px}}
section{background:var(--surface);border:1px solid var(--rule);border-radius:4px}
section+section{margin-top:20px}
.pad{padding:0 20px 18px}
h2{margin:0;font-size:1.02rem;font-weight:700;padding:14px 20px 12px}
h3{margin:20px 0 8px;font-size:.95rem;color:var(--ink-soft);font-weight:600}

label{display:block;font-size:.88rem;color:var(--ink-soft);margin:14px 0 5px}
input,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--rule);
  border-radius:3px;background:var(--surface);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions button{flex:1 1 8rem;padding:10px;font:inherit;font-weight:600;cursor:pointer;
  border-radius:3px;border:1px solid var(--rule);background:transparent;color:var(--ink)}
.actions button.go{background:var(--accent);border-color:var(--accent);color:#fff}
.actions button:hover{border-color:var(--accent)}

table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border-bottom:1px solid var(--rule-soft);padding:7px 5px;text-align:center}
thead th{border-bottom:1px solid var(--rule);color:var(--ink-soft);font-weight:600;font-size:.84rem}
tbody tr:nth-child(odd){background:var(--accent-soft)}
td input{border:1px solid transparent;background:transparent;text-align:center;padding:6px 2px}
td input:hover{border-color:var(--rule)}
.who{display:inline-flex;align-items:center;gap:7px;font-weight:600}
input.name{width:4.4rem;padding:5px 6px;font-size:.9rem;text-align:left;border:1px solid var(--rule-soft);border-radius:3px}
input.name:focus{border-color:var(--accent)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}

.report{margin:0;padding:0 20px 8px}
.report>div{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dotted var(--rule)}
.report dt{flex:none;color:var(--ink-soft);font-size:.92rem}
.report .lead{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px)}
.report dd{margin:0;font-weight:700;font-size:1.06rem;text-align:right}
.report small{display:block;font-weight:400;font-size:.8rem;color:var(--ink-soft)}

.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;padding:12px;font:inherit;font-weight:600;cursor:pointer;
  background:transparent;border:0;border-bottom:3px solid transparent;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 20px 14px;font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:7px}
.caption{padding:0 20px 18px;font-size:.88rem;color:var(--ink-soft);margin:0}
.flagbox{margin:0 20px 18px;padding:11px 14px;border-left:3px solid var(--accent);
  background:var(--accent-soft);font-size:.92rem;border-radius:0 3px 3px 0}
.flagbox.warn{border-left-color:var(--flag)}
.warn-t{color:var(--flag);font-weight:700}

#welcome{position:fixed;inset:0;background:var(--paper);z-index:20;overflow:auto;display:flex;flex-direction:column}
#welcome .inner{max-width:900px;margin:auto;padding:34px 22px 46px;width:100%}
#welcome h2{padding:0;font-size:1.7rem;margin:18px 0 6px}
.lead2{margin:0 0 26px;color:var(--ink-soft);max-width:46rem}
fieldset{border:0;padding:0;margin:0 0 26px}
legend{font-weight:700;margin-bottom:10px;font-size:1rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
.choice{text-align:left;padding:15px 16px;border:1px solid var(--rule);border-radius:4px;
  background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;display:flex;gap:13px}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice b{display:block;font-size:1rem}
.choice small{color:var(--ink-soft);font-size:.86rem;line-height:1.5;display:block;margin-top:3px}
.chip{width:34px;height:34px;border-radius:3px;flex:none;border:1px solid var(--rule)}
#start{margin-top:4px;padding:13px 30px;font:inherit;font-weight:700;font-size:1.04rem;
  background:var(--accent);color:#fff;border:0;border-radius:3px;cursor:pointer}
@media(prefers-reduced-motion:no-preference){
  #welcome{transition:opacity .3s ease}
  .fade{opacity:0;pointer-events:none}
}
footer{max-width:1240px;margin:0 auto;padding:0 20px 46px;font-size:.85rem;color:var(--ink-soft)}
</style>
</head>
<body>

<div id="welcome" role="dialog" aria-labelledby="wTitle">
  <div class="ticks tall"></div>
  <div class="inner">
    <h2 id="wTitle">重複性靶心</h2>
    <p class="lead2">五位同學各量五次，把 25 筆讀值放到同一張靶上，看分散、看偏移，也看人與人之間的差異。開始前先選兩件事。</p>

    <fieldset>
      <legend>今天量什麼</legend>
      <div class="choices" id="scenPick">
        <button class="choice" data-scen="marker" aria-pressed="true">
          <span class="chip" style="background:#5E6B73"></span>
          <span><b>白板筆</b><small>沒有標準件。靶心是全班平均，只能看一致性，算不出偏差。</small></span>
        </button>
        <button class="choice" data-scen="gauge" aria-pressed="false">
          <span class="chip" style="background:#9AA7AF"></span>
          <span><b>塊規</b><small>有校正值。靶心是真值，分散與偏差都看得到。</small></span>
        </button>
        <button class="choice" data-scen="free" aria-pressed="false">
          <span class="chip" style="background:#C2CBD1"></span>
          <span><b>自訂</b><small>量別的工件，名稱與靶心自己填。</small></span>
        </button>
      </div>
    </fieldset>

    <fieldset>
      <legend>怎麼看比較舒服</legend>
      <div class="choices" id="themePick">
        <button class="choice" data-theme="lab" data-scale="1" aria-pressed="true">
          <span class="chip" style="background:#EEF2F5"></span>
          <span><b>量測室</b><small>淺色，適合自己的筆電或平板。</small></span>
        </button>
        <button class="choice" data-theme="blueprint" data-scale="1" aria-pressed="false">
          <span class="chip" style="background:#0C2132"></span>
          <span><b>藍圖</b><small>深色，投影或關燈的教室看得清楚。</small></span>
        </button>
        <button class="choice" data-theme="contrast" data-scale="1.16" aria-pressed="false">
          <span class="chip" style="background:#fff;border:2px solid #000"></span>
          <span><b>高對比大字</b><small>字大、邊界明確，坐後排或看得吃力時選這個。</small></span>
        </button>
      </div>
    </fieldset>

    <button id="start">開始量測</button>
    <p class="caption" style="padding:14px 0 0">這兩項設定隨時能從右上角改。</p>
  </div>
</div>

<header>
  <div class="bar">
    <h1>重複性靶心</h1>
    <span class="subject" id="subjectLine"></span>
    <div class="switches" id="themeSwitch">
      <button data-theme="lab" data-scale="1" aria-pressed="true">量測室</button>
      <button data-theme="blueprint" data-scale="1" aria-pressed="false">藍圖</button>
      <button data-theme="contrast" data-scale="1.16" aria-pressed="false">大字</button>
    </div>
  </div>
  <div class="ticks"></div>
</header>

<main>
<div>
  <section>
    <h2>量測設定</h2>
    <div class="pad">
      <label for="subject">量測對象與位置</label>
      <input id="subject" type="text" value="白板筆筆桿外徑（距筆蓋端 30 mm）">
      <label for="centerMode">靶心用什麼</label>
      <select id="centerMode">
        <option value="mean">全班總平均（沒有標準件）</option>
        <option value="ref">標準件校正值（有塊規）</option>
      </select>
      <div id="refWrap" hidden>
        <label for="refVal">校正值（mm）</label>
        <input id="refVal" type="number" step="0.001" value="47.340">
      </div>
      <label for="sMode">圈圈用哪個標準差</label>
      <select id="sMode">
        <option value="all">全部 25 筆的 s（含人與人差異）</option>
        <option value="within">組內合併 s（純重複性）</option>
      </select>
    </div>
    <div class="flagbox" id="centerNote"></div>
  </section>

  <section>
    <h2>讀值紀錄（mm）</h2>
    <div class="pad">
      <table id="grid"></table>
      <div class="actions">
        <button class="go" onclick="demo()">載入示範資料</button>
        <button onclick="spoil()">加一筆離群值</button>
        <button onclick="clearAll()">清空</button>
        <button onclick="exportCSV()">匯出 CSV</button>
      </div>
      <p class="caption" style="padding:12px 0 0">每次都要取放重來：量完鬆開、離開工件，再重新夾持。</p>
    </div>
  </section>
</div>

<div>
  <section>
    <div class="tabs" role="tablist">
      <button id="tabT" role="tab" aria-selected="true" onclick="setView('target')">靶心</button>
      <button id="tabL" role="tab" aria-selected="false" onclick="setView('line')">數線</button>
    </div>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
    <p class="caption" id="viewHint"></p>
  </section>

  <section>
    <h2>統計結果</h2>
    <dl class="report" id="report"></dl>
    <div class="pad" style="padding-top:2px">
      <h3>各同學（組內就是重複性）</h3>
      <table id="perTable"></table>
    </div>
    <div class="flagbox" id="teach" hidden></div>
  </section>
</div>
</main>

<footer>
  依據 VIM：2.15 精密度、2.18 偏差、2.20／2.21 重複性、2.25 再現性。68–95 為常態分布的近似法則。
  靶心視圖的半徑等於偏離量除以 s；角度只用來分辨是哪位同學，不含量測資訊。
</footer>

<script>
const K=5, N=5;
const COLORS=["#0E6BA8","#A82C22","#1E6F50","#6A4C93","#B5651D"];
let view="target", data=Array.from({length:K},()=>Array(N).fill("")), firstDraw=true;
let names=Array(K).fill("");
const who=i=>names[i].trim()||("同學 "+(i+1));

const $=id=>document.getElementById(id);
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));};

function applyTheme(t,sc){
  document.documentElement.dataset.theme=t;
  document.documentElement.style.setProperty("--s",sc);
  ["themeSwitch","themePick"].forEach(id=>
    $(id).querySelectorAll("button").forEach(b=>
      b.setAttribute("aria-pressed", String(b.dataset.theme===t))));
}
["themeSwitch","themePick"].forEach(id=>
  $(id).addEventListener("click",e=>{
    const b=e.target.closest("button");
    if(b) applyTheme(b.dataset.theme,b.dataset.scale);
  }));

const SCEN={
  marker:{subject:"白板筆筆桿外徑（距筆蓋端 30 mm）",center:"mean"},
  gauge :{subject:"塊規 47.340 mm",center:"ref"},
  free  :{subject:"",center:"mean"}
};
let scen="marker";
$("scenPick").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  scen=b.dataset.scen;
  $("scenPick").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", String(x===b)));
});
$("start").addEventListener("click",()=>{
  const c=SCEN[scen];
  $("subject").value=c.subject;
  $("centerMode").value=c.center;
  const w=$("welcome"); w.classList.add("fade");
  setTimeout(()=>w.remove(),320);
  render();
});

function buildGrid(){
  let h="<thead><tr><th>姓氏</th>";
  for(let j=0;j<N;j++) h+=`<th>第 ${j+1} 次</th>`;
  h+="</tr></thead><tbody>";
  for(let i=0;i<K;i++){
    h+=`<tr><td><span class="who"><span class="dot" style="background:${COLORS[i]}"></span>
        <input class="name" type="text" maxlength="6" placeholder="姓氏" value="${names[i]}"
         aria-label="第${i+1}位同學姓氏" oninput="setName(${i},this.value)"></span></td>`;
    for(let j=0;j<N;j++)
      h+=`<td><input class="num" type="number" step="0.001" value="${data[i][j]}" aria-label="同學${i+1}第${j+1}次" oninput="sync(${i},${j},this.value)"></td>`;
    h+="</tr>";
  }
  $("grid").innerHTML=h+"</tbody>";
}
function sync(i,j,v){ data[i][j]=v; render(); }
function setName(i,v){ names[i]=v; render(); }
function clearAll(){ data=Array.from({length:K},()=>Array(N).fill("")); names=Array(K).fill(""); buildGrid(); render(); }
function demo(){
  data=[[47.363,47.365,47.362,47.366,47.364],
        [47.343,47.345,47.344,47.342,47.346],
        [47.328,47.332,47.330,47.327,47.333],
        [47.320,47.324,47.322,47.323,47.321],
        [47.350,47.353,47.351,47.354,47.352]].map(r=>r.map(v=>v.toFixed(3)));
  names=["陳","林","黃","張","李"];
  buildGrid(); render();
}
function spoil(){ if(!data[4][3]) demo(); data[4][3]="47.490"; buildGrid(); render(); }
function exportCSV(){
  const rows=[["姓氏","第1次","第2次","第3次","第4次","第5次"]];
  data.forEach((r,i)=>rows.push([who(i),...r]));
  const b=new Blob(["\uFEFF"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="重複性靶心_資料.csv"; a.click();
  URL.revokeObjectURL(a.href);
}

function drawTarget(center,s,per){
  const W=640,H=562,cx=W/2,cy=258,R=196;
  const px=d=>Math.min(Math.abs(d)/s,3.35)/3*R;
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  g+=firstDraw
    ? `<g opacity="0"><animate attributeName="opacity" to="1" dur="0.45s" fill="freeze"/>`
    : `<g>`;
  [[3,"transparent"],[2,"var(--ring-mid)"],[1,"var(--ring-in)"]].forEach(([k,f])=>
    g+=`<circle cx="${cx}" cy="${cy}" r="${R*k/3}" fill="${f}" stroke="var(--rule)"/>`);
  g+=`<line x1="${cx-9}" y1="${cy}" x2="${cx+9}" y2="${cy}" stroke="var(--ink)" stroke-width="1.5"/>`;
  g+=`<line x1="${cx}" y1="${cy-9}" x2="${cx}" y2="${cy+9}" stroke="var(--ink)" stroke-width="1.5"/>`;
  const dec = s<0.01 ? 4 : 3;
  [1,2,3].forEach(k=>{
    const yy=cy-9;
    g+=`<text x="${cx+R*k/3-6}" y="${yy}" font-size="13" fill="var(--ink-soft)" text-anchor="end">${k}s</text>`;
    g+=`<text x="${cx+R*k/3-6}" y="${yy+15}" font-size="12.5" fill="var(--ink-soft)" text-anchor="end">±${(k*s).toFixed(dec)}</text>`;
  });
  g+=`<text x="${cx}" y="${cy+26}" font-size="13" fill="var(--ink-soft)" text-anchor="middle">靶心 ${center.toFixed(dec)} mm</text>`;
  per.forEach((row,i)=>{
    const base=-Math.PI/2+i*2*Math.PI/K;
    row.forEach((v,j)=>{
      const d=v-center, r=px(d), ang=base+(j-(row.length-1)/2)*0.20;
      const x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
      g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="${d>=0?COLORS[i]:"var(--surface)"}" stroke="${COLORS[i]}" stroke-width="2"><title>${who(i)} 第${j+1}次：${v} mm（偏離 ${(d>=0?"+":"")}${d.toFixed(3)}）</title></circle>`;
    });
  });
  g+=`<text x="${cx}" y="${cy+R+40}" font-size="14" fill="var(--ink-soft)" text-anchor="middle">一圈 = 1s = ${s.toFixed(dec)} mm　（單位皆為 mm）</text>`;
  g+=`<text x="${cx}" y="${cy+R+62}" font-size="14" fill="var(--ink-soft)" text-anchor="middle">實心是比靶心大，空心是比靶心小</text>`;
  return g+"</g></svg>";
}

function drawLine(center,s,per){
  const W=640,H=446,L=86,Rt=W-40,mid=(L+Rt)/2, span=3.4*s||1;
  const X=v=>mid+(v-center)/span*(Rt-mid);
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  g+=`<rect x="${X(center-2*s)}" y="42" width="${X(center+2*s)-X(center-2*s)}" height="296" fill="var(--ring-mid)"/>`;
  g+=`<rect x="${X(center-s)}" y="42" width="${X(center+s)-X(center-s)}" height="296" fill="var(--ring-in)"/>`;
  const dec = s<0.01 ? 4 : 3;
  [[-2,"−2s"],[-1,"−1s"],[0,"靶心"],[1,"+1s"],[2,"+2s"]].forEach(([k,t])=>{
    const x=X(center+k*s);
    g+=`<line x1="${x}" y1="42" x2="${x}" y2="338" stroke="${k?"var(--rule)":"var(--ink)"}" stroke-width="${k?1:1.8}" ${k?'stroke-dasharray="4 4"':""}/>`;
    g+=`<text x="${x}" y="358" font-size="13" fill="var(--ink-soft)" text-anchor="middle">${t}</text>`;
    g+=`<text x="${x}" y="374" font-size="12.5" fill="var(--ink-soft)" text-anchor="middle">${(center+k*s).toFixed(dec)}</text>`;
  });
  per.forEach((row,i)=>{
    const y=72+i*53;
    g+=`<text x="14" y="${y+5}" font-size="13.5" fill="${COLORS[i]}">${who(i)}</text>`;
    g+=`<line x1="${L}" y1="${y}" x2="${Rt}" y2="${y}" stroke="var(--rule-soft)"/>`;
    row.forEach((v,j)=>{
      const x=Math.max(L,Math.min(Rt,X(v)));
      g+=`<circle cx="${x.toFixed(1)}" cy="${y}" r="6" fill="${COLORS[i]}" opacity=".85"><title>${who(i)} 第${j+1}次：${v} mm</title></circle>`;
    });
    if(row.length){
      const xm=Math.max(L,Math.min(Rt,X(mean(row))));
      g+=`<line x1="${xm}" y1="${y-17}" x2="${xm}" y2="${y+17}" stroke="${COLORS[i]}" stroke-width="2.5"/>`;
    }
  });
  g+=`<text x="${mid}" y="416" font-size="14" fill="var(--ink-soft)" text-anchor="middle">直線是該同學的平均值　｜　1s = ${s.toFixed(dec)} mm</text>`;
  return g+"</svg>";
}

function render(){
  const per=data.map(r=>r.map(v=>parseFloat(v)).filter(v=>!isNaN(v)));
  const all=per.flat();
  const mode=$("centerMode").value, refVal=parseFloat($("refVal").value);
  $("refWrap").hidden = mode!=="ref";
  $("subjectLine").textContent = $("subject").value || "尚未填寫量測對象";

  $("centerNote").className = "flagbox" + (mode==="ref" ? "" : " warn");
  $("centerNote").innerHTML = mode==="ref"
    ? "靶心是標準件的校正值，所以這張圖同時看得到分散與偏差。"
    : "靶心是全班自己的平均，<span class='warn-t'>只能看一致性，不能談準不準</span>。沒有標準件就沒有偏差可算。";

  if(all.length<4){
    $("chart").innerHTML=`<p class="caption" style="padding:34px 20px">先填入至少四筆讀值，或按「載入示範資料」看看這張圖會長什麼樣。</p>`;
    $("report").innerHTML=""; $("perTable").innerHTML=""; $("legend").innerHTML="";
    $("teach").hidden=true; $("viewHint").textContent=""; return;
  }

  const grand=mean(all), sAll=sd(all);
  const valid=per.filter(r=>r.length>=2);
  const sWithin=valid.length?Math.sqrt(mean(valid.map(r=>sd(r)**2))):NaN;
  const sBetween=valid.length>=2?sd(valid.map(r=>mean(r))):NaN;
  const center=(mode==="ref"&&!isNaN(refVal))?refVal:grand;
  const sPick=($("sMode").value==="within"&&sWithin>0)?sWithin:sAll;
  const s=sPick>0?sPick:0.001;
  const in1=all.filter(v=>Math.abs(v-center)<=s).length;
  const in2=all.filter(v=>Math.abs(v-center)<=2*s).length;

  $("chart").innerHTML = view==="target"?drawTarget(center,s,per):drawLine(center,s,per);
  firstDraw=false;
  $("legend").innerHTML = per.map((_,i)=>
    `<span><span class="dot" style="background:${COLORS[i]}"></span>${who(i)}</span>`).join("");
  $("viewHint").textContent = view==="target"
    ? "半徑是偏離量除以 s，角度只是把五個人分開，不代表任何量測資訊。"
    : "統計上最標準的畫法：橫軸就是量測值，色帶為正負 1s 與 2s。";

  const rows=[
    ["靶心值", center.toFixed(4)+" mm", mode==="ref"?"標準件校正值":"全班總平均"],
    ["總平均", grand.toFixed(4)+" mm", all.length+" 筆"],
    ["全體標準差 s", sAll.toFixed(4)+" mm", "含人與人差異"],
    ["組內合併 s", isNaN(sWithin)?"—":sWithin.toFixed(4)+" mm", "重複性"],
    ["組間 s", isNaN(sBetween)?"—":sBetween.toFixed(4)+" mm", "再現性"],
    ["落在 ±1s", in1+" / "+all.length, "±"+s.toFixed(4)+" mm，理論約 68 %"],
    ["落在 ±2s", in2+" / "+all.length, "±"+(2*s).toFixed(4)+" mm，理論約 95 %"],
    ["偏差", (mode==="ref"&&!isNaN(refVal))
      ? ((grand-refVal>=0?"+":"")+(grand-refVal).toFixed(4)+" mm") : "無法評估",
      (mode==="ref"&&!isNaN(refVal))?"總平均減校正值":"沒有標準件"]
  ];
  $("report").innerHTML = rows.map(([t,v,h])=>
    `<div><dt>${t}</dt><span class="lead"></span><dd class="num">${v}<small>${h}</small></dd></div>`).join("");

  let t=`<thead><tr><th>姓氏</th><th>次數</th><th>平均</th><th>s</th><th>s ÷ √n</th><th>與靶心差</th></tr></thead><tbody>`;
  per.forEach((r,i)=>{
    if(!r.length){ t+=`<tr><td>${who(i)}</td><td colspan="5" style="color:var(--ink-soft)">尚未填寫</td></tr>`; return; }
    const m=mean(r), sv=sd(r), d=m-center;
    t+=`<tr><td><span class="who"><span class="dot" style="background:${COLORS[i]}"></span>${who(i)}</span></td>
      <td class="num">${r.length}</td><td class="num">${m.toFixed(4)}</td>
      <td class="num">${isNaN(sv)?"—":sv.toFixed(4)}</td>
      <td class="num">${isNaN(sv)?"—":(sv/Math.sqrt(r.length)).toFixed(4)}</td>
      <td class="num" style="color:${Math.abs(d)>s?"var(--flag)":"var(--ok)"}">${(d>=0?"+":"")+d.toFixed(4)}</td></tr>`;
  });
  $("perTable").innerHTML=t+"</tbody>";

  let msg="";
  if(!isNaN(sWithin)&&!isNaN(sBetween)){
    msg = sBetween>sWithin
      ? "組間 s 大於組內 s：每個人自己量都很穩，但五個人對不起來。這是<b>再現性</b>問題，多半出在量的位置沒講好，或量測力差太多。"
      : "組內 s 與組間 s 相當：五個人一致性不錯，變異主要來自各自的重複量測，屬於<b>重複性</b>問題，例如夾持、對準或解析度。";
  }
  if(sAll>0&&sAll<0.004)
    msg+=" 另外，s 已接近卡尺解析度 0.01 mm，這時要改用解析度分量 0.01 ÷ (2√3) = 0.0029 mm 表示。";
  $("teach").innerHTML=msg; $("teach").hidden=!msg;
}

function setView(v){
  view=v;
  $("tabT").setAttribute("aria-selected", String(v==="target"));
  $("tabL").setAttribute("aria-selected", String(v==="line"));
  render();
}
["centerMode","sMode","refVal","subject"].forEach(id=>$(id).addEventListener("input",render));
buildGrid(); render();
</script>
</body>
</html>
