<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重複性靶心遊戲｜平均、標準差與偏差</title>
<style>
:root{
  --ink:#1F3864; --blue:#2E74B5; --line:#8FAADC; --bg:#F4F7FB; --card:#FFFFFF;
  --gray:#5A6B7B; --red:#C0504D; --green:#2E7D52; --amber:#FFF6E0;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#222;font-size:17px;line-height:1.6}
header{background:var(--ink);color:#fff;padding:18px 4vw}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;font-size:16px;opacity:.9}
main{max-width:1280px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid #DCE6EF;border-radius:14px;padding:18px;margin-bottom:18px}
h2{font-size:19px;color:var(--blue);margin:0 0 12px}
h3{font-size:17px;margin:16px 0 8px;color:var(--ink)}
label{display:block;font-size:15px;margin:10px 0 4px;color:var(--gray)}
input,select,button{font:inherit;border-radius:8px;border:1px solid #C3D2DF;padding:8px 10px;background:#fff;color:#222}
input[type=number]{width:100%;text-align:center}
button{cursor:pointer;font-weight:600}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.ghost{background:#EEF3F9;color:var(--ink)}
button:hover{filter:brightness(.95)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1;min-width:120px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid #DCE6EF;padding:6px 4px;text-align:center}
th{background:#E8F0FA;color:var(--ink);font-size:14px}
td input{border:none;width:100%;padding:6px 2px;font-size:15px}
td input:focus{outline:2px solid var(--line);border-radius:4px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.note{background:var(--amber);border-left:4px solid #E0A800;padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px;margin-top:12px}
.warn{color:var(--red);font-weight:600}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.stat div{background:#F7FAFD;border:1px solid #E4ECF4;border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--gray)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;background:#EEF3F9;border-color:#DCE6EF;color:var(--gray)}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:15px;margin-top:10px}
.hint{font-size:14px;color:var(--gray);margin-top:8px}
footer{max-width:1280px;margin:0 auto 40px;padding:0 16px;font-size:14px;color:var(--gray)}
</style>
</head>
<body>
<header>
  <h1>重複性靶心遊戲｜5 位同學 × 5 次量測</h1>
  <p>一張圖同時看見：平均（位置）、標準差（分散）、偏差（偏移），以及重複性與再現性的差別</p>
</header>

<main>
<section>
  <div class="card">
    <h2>① 設定</h2>
    <label>量測對象（例：白板筆筆桿外徑、47 mm 塊規）</label>
    <input id="subject" type="text" value="白板筆筆桿外徑（距筆蓋端 30 mm）">
    <label>靶心設定</label>
    <select id="centerMode">
      <option value="mean">全班總平均（沒有標準件時）</option>
      <option value="ref">標準件校正值（有塊規時）</option>
    </select>
    <div id="refWrap" style="display:none">
      <label>標準件校正值（mm）</label>
      <input id="refVal" type="number" step="0.001" value="47.340">
    </div>
    <label>圈圈用哪一個標準差？</label>
    <select id="sMode">
      <option value="all">全部 25 筆的 s（含人與人差異）</option>
      <option value="within">組內合併 s（純重複性）</option>
    </select>
    <div class="note" id="centerNote"></div>
  </div>

  <div class="card">
    <h2>② 填入量測值（mm）</h2>
    <table id="grid"></table>
    <div class="row">
      <button class="primary" onclick="render()">重新計算</button>
      <button class="ghost" onclick="demo()">載入示範資料</button>
      <button class="ghost" onclick="spoil()">製造一筆離群值</button>
      <button class="ghost" onclick="clearAll()">清空</button>
      <button class="ghost" onclick="exportCSV()">匯出 CSV</button>
    </div>
    <p class="hint">每位同學都要「取放重來」量 5 次：量完鬆開、離開工件，再重新夾持。</p>
  </div>
</section>

<section>
  <div class="card">
    <div class="tabs">
      <button id="tabT" class="on" onclick="setView('target')">靶心視圖（直覺）</button>
      <button id="tabL" onclick="setView('line')">數線視圖（標準）</button>
    </div>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
    <div class="hint" id="viewHint"></div>
  </div>

  <div class="card">
    <h2>③ 統計結果</h2>
    <div class="stat" id="stats"></div>
    <h3>各同學（組內＝重複性）</h3>
    <table id="perTable"></table>
    <div class="note" id="teach"></div>
  </div>
</section>
</main>

<footer>
  觀念依據：VIM 2.15 精密度、2.18 偏差、2.20/2.21 重複性、2.25 再現性；68–95 法則為常態分布之近似經驗法則。
  半徑＝|偏離量| ÷ s，角度僅用於區分同學，不含任何量測資訊。
</footer>

<script>
const K = 5, N = 5;               // 5 位同學 × 5 次
const COLORS = ["#2E74B5","#C0504D","#2E7D52","#7B5EA7","#C77B23"];
let view = "target";
let data = Array.from({length:K},()=>Array(N).fill(""));

/* ---------- 輸入表格 ---------- */
function buildGrid(){
  let h = "<tr><th>同學</th>";
  for(let j=0;j<N;j++) h += `<th>第${j+1}次</th>`;
  h += "</tr>";
  for(let i=0;i<K;i++){
    h += `<tr><td style="background:#F7FAFD"><span class="swatch" style="background:${COLORS[i]}"></span>${i+1}</td>`;
    for(let j=0;j<N;j++)
      h += `<td><input type="number" step="0.001" id="c${i}_${j}" value="${data[i][j]}" oninput="sync(${i},${j},this.value)"></td>`;
    h += "</tr>";
  }
  document.getElementById("grid").innerHTML = h;
}
function sync(i,j,v){ data[i][j]=v; render(); }
function clearAll(){ data = Array.from({length:K},()=>Array(N).fill("")); buildGrid(); render(); }
function demo(){
  // 同學1：精密但偏高｜2：理想｜3：分散｜4：略偏低｜5：含一筆離群
  // 五人各自都很穩（群內緊），但五群中心散開 → 典型「再現性」問題
  data = [
    [47.363,47.365,47.362,47.366,47.364],
    [47.343,47.345,47.344,47.342,47.346],
    [47.328,47.332,47.330,47.327,47.333],
    [47.320,47.324,47.322,47.323,47.321],
    [47.350,47.353,47.351,47.354,47.352]
  ].map(r=>r.map(v=>v.toFixed(3)));
  buildGrid(); render();
}

/* ---------- 統計 ---------- */
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
const sd = a => { if(a.length<2) return NaN; const m=mean(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };

function collect(){
  const per = data.map(r => r.map(v=>parseFloat(v)).filter(v=>!isNaN(v)));
  const all = per.flat();
  return {per, all};
}

/* ---------- 繪圖 ---------- */
function drawTarget(center, s, per, unitTxt){
  const W=620,H=520,cx=W/2,cy=250,R=190;   // 3s = R
  const px = d => Math.min(Math.abs(d)/s,3.35)/3*R;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="靶心視圖">`;
  [[3,"#FFFFFF"],[2,"#F3F7FC"],[1,"#FDECEC"]].forEach(([k,f])=>{
    g += `<circle cx="${cx}" cy="${cy}" r="${R*k/3}" fill="${f}" stroke="#8FAADC"/>`;
  });
  g += `<circle cx="${cx}" cy="${cy}" r="3" fill="#1F3864"/>`;
  [[1,"1s"],[2,"2s"],[3,"3s"]].forEach(([k,t])=>{
    g += `<text x="${cx+R*k/3-4}" y="${cy-6}" font-size="13" fill="#5A6B7B" text-anchor="end">${t}</text>`;
  });
  per.forEach((row,i)=>{
    const base = -Math.PI/2 + i*2*Math.PI/K;
    row.forEach((v,j)=>{
      const d=v-center, r=px(d);
      const ang = base + (j-(row.length-1)/2)*0.20;
      const x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="${d>=0?COLORS[i]:"#fff"}" stroke="${COLORS[i]}" stroke-width="2"><title>同學${i+1} 第${j+1}次：${v} ${unitTxt}（偏離 ${(d>=0?"+":"")}${d.toFixed(3)}）</title></circle>`;
    });
  });
  g += `<text x="${cx}" y="${cy+R+40}" font-size="15" fill="#5A6B7B" text-anchor="middle">實心＝讀值大於靶心　空心＝小於靶心　｜　角度僅用於區分同學</text>`;
  g += `</svg>`;
  return g;
}

function drawLine(center, s, per, unitTxt){
  const W=620,H=420,L=70,Rt=W-40,mid=(L+Rt)/2;
  const span = 3.4*s || 1;
  const X = v => mid + (v-center)/span*(Rt-mid);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="數線視圖">`;
  g += `<rect x="${X(center-2*s)}" y="40" width="${X(center+2*s)-X(center-2*s)}" height="290" fill="#F3F7FC"/>`;
  g += `<rect x="${X(center-s)}" y="40" width="${X(center+s)-X(center-s)}" height="290" fill="#FDECEC"/>`;
  [[-2,"−2s"],[-1,"−1s"],[0,"靶心"],[1,"+1s"],[2,"+2s"]].forEach(([k,t])=>{
    const x=X(center+k*s);
    g += `<line x1="${x}" y1="40" x2="${x}" y2="330" stroke="${k===0?"#1F3864":"#8FAADC"}" stroke-width="${k===0?2:1}" ${k===0?"":'stroke-dasharray="4 3"'}/>`;
    g += `<text x="${x}" y="352" font-size="13" fill="#5A6B7B" text-anchor="middle">${t}</text>`;
  });
  per.forEach((row,i)=>{
    const y = 70 + i*52;
    g += `<text x="16" y="${y+5}" font-size="14" fill="${COLORS[i]}">同學${i+1}</text>`;
    g += `<line x1="${L}" y1="${y}" x2="${Rt}" y2="${y}" stroke="#EEF3F9"/>`;
    row.forEach((v,j)=>{
      const x=Math.max(L,Math.min(Rt,X(v)));
      g += `<circle cx="${x.toFixed(1)}" cy="${y}" r="6" fill="${COLORS[i]}" opacity=".85"><title>同學${i+1} 第${j+1}次：${v} ${unitTxt}</title></circle>`;
    });
    if(row.length){
      const xm=Math.max(L,Math.min(Rt,X(mean(row))));
      g += `<line x1="${xm}" y1="${y-16}" x2="${xm}" y2="${y+16}" stroke="${COLORS[i]}" stroke-width="2.5"/>`;
    }
  });
  g += `<text x="${mid}" y="392" font-size="15" fill="#5A6B7B" text-anchor="middle">粗線＝該同學的平均值　｜　橫軸為量測值（${unitTxt}）</text>`;
  g += `</svg>`;
  return g;
}

/* ---------- 主流程 ---------- */
function render(){
  const {per, all} = collect();
  const mode = document.getElementById("centerMode").value;
  const refVal = parseFloat(document.getElementById("refVal").value);
  document.getElementById("refWrap").style.display = mode==="ref" ? "block" : "none";

  document.getElementById("centerNote").innerHTML = mode==="ref"
    ? "靶心＝標準件校正值：<b>分散與偏差都看得到</b>，可以談準不準。"
    : "靶心＝全班總平均：<span class='warn'>這張靶只能看一致性，不能談準確度</span>（沒有標準件就沒有偏差可算）。";

  if(all.length < 4){
    document.getElementById("chart").innerHTML = "<p class='hint'>請至少填入 4 筆數值，或按「載入示範資料」。</p>";
    document.getElementById("stats").innerHTML = ""; document.getElementById("perTable").innerHTML = "";
    document.getElementById("teach").textContent = ""; document.getElementById("legend").innerHTML = "";
    return;
  }

  const grand = mean(all), sAll = sd(all);
  const valid = per.filter(r=>r.length>=2);
  const sWithin = valid.length ? Math.sqrt(mean(valid.map(r=>sd(r)**2))) : NaN;
  const sBetween = valid.length>=2 ? sd(valid.map(r=>mean(r))) : NaN;
  const center = (mode==="ref" && !isNaN(refVal)) ? refVal : grand;
  const s = (document.getElementById("sMode").value==="within" && sWithin>0) ? sWithin : sAll;
  const sUse = s>0 ? s : 0.001;
  const unitTxt = "mm";

  const in1 = all.filter(v=>Math.abs(v-center)<=sUse).length;
  const in2 = all.filter(v=>Math.abs(v-center)<=2*sUse).length;

  document.getElementById("chart").innerHTML =
    view==="target" ? drawTarget(center,sUse,per,unitTxt) : drawLine(center,sUse,per,unitTxt);
  document.getElementById("legend").innerHTML =
    per.map((_,i)=>`<span><span class="swatch" style="background:${COLORS[i]}"></span>同學 ${i+1}</span>`).join("");
  document.getElementById("viewHint").textContent = view==="target"
    ? "半徑＝|偏離量| ÷ s（有嚴格意義）；角度只是把五位同學分開，不代表任何量測資訊。"
    : "統計上最標準的畫法：橫軸就是量測值，色帶為 ±1s 與 ±2s。";

  const cards = [
    ["總平均 x̄", grand.toFixed(4)+" mm", "全部 "+all.length+" 筆"],
    ["全體標準差 s", sAll.toFixed(4)+" mm", "含人與人差異"],
    ["組內合併 s", isNaN(sWithin)?"—":sWithin.toFixed(4)+" mm", "重複性（群內）"],
    ["組間 s", isNaN(sBetween)?"—":sBetween.toFixed(4)+" mm", "再現性（群間）"],
    ["落在 ±1s", in1+" / "+all.length+"（"+Math.round(in1/all.length*100)+"%）", "理論約 68 %"],
    ["落在 ±2s", in2+" / "+all.length+"（"+Math.round(in2/all.length*100)+"%）", "理論約 95 %"],
  ];
  if(mode==="ref" && !isNaN(refVal))
    cards.push(["偏差 b", ((grand-refVal>=0?"+":"")+(grand-refVal).toFixed(4))+" mm", "總平均 − 校正值"]);
  else
    cards.push(["偏差 b", "無法評估", "沒有標準件"]);
  document.getElementById("stats").innerHTML =
    cards.map(([t,v,h])=>`<div><span>${t}</span><b>${v}</b><span>${h}</span></div>`).join("");

  let t = "<tr><th>同學</th><th>次數</th><th>平均 x̄ (mm)</th><th>標準差 s (mm)</th><th>s(x̄)=s/√n</th><th>與靶心差</th></tr>";
  per.forEach((r,i)=>{
    if(!r.length){ t += `<tr><td>${i+1}</td><td colspan="5" style="color:#9AA">尚未填寫</td></tr>`; return; }
    const m=mean(r), sv=sd(r), d=m-center;
    t += `<tr><td><span class="swatch" style="background:${COLORS[i]}"></span>${i+1}</td><td>${r.length}</td>
      <td>${m.toFixed(4)}</td><td>${isNaN(sv)?"—":sv.toFixed(4)}</td>
      <td>${isNaN(sv)?"—":(sv/Math.sqrt(r.length)).toFixed(4)}</td>
      <td style="color:${Math.abs(d)>sUse?"#C0504D":"#2E7D52"}">${(d>=0?"+":"")+d.toFixed(4)}</td></tr>`;
  });
  document.getElementById("perTable").innerHTML = t;

  let msg = "";
  if(!isNaN(sWithin) && !isNaN(sBetween)){
    msg = sBetween > sWithin
      ? "觀察：<b>組間 s 大於組內 s</b> — 每個人自己量都算穩定，但五個人之間對不起來。這是<b>再現性</b>問題，常見原因是受測量定義不一致（量的位置不同）或量測力差太多。"
      : "觀察：<b>組內 s 與組間 s 相當</b> — 五位同學的一致性不錯，主要變異來自每個人自己的重複量測，屬於<b>重複性</b>問題（夾持、對準、解析度）。";
  }
  if(sAll>0 && sAll<0.004) msg += " 另外：s 已接近或小於卡尺解析度 0.01 mm，此時要改用解析度分量 0.01÷(2√3)=0.0029 mm 表示。";
  document.getElementById("teach").innerHTML = msg;
}

function setView(v){
  view=v;
  document.getElementById("tabT").className = v==="target"?"on":"";
  document.getElementById("tabL").className = v==="line"?"on":"";
  render();
}
function spoil(){
  if(!data[4][3]) demo();
  data[4][3] = "47.490";                    // 把同學5的第4次改成離群值
  buildGrid(); render();
}
function exportCSV(){
  const rows = [["同學","第1次","第2次","第3次","第4次","第5次"]];
  data.forEach((r,i)=>rows.push([i+1,...r]));
  const blob = new Blob(["\uFEFF"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "重複性靶心遊戲_資料.csv";
  a.click(); URL.revokeObjectURL(a.href);
}
["centerMode","sMode","refVal"].forEach(id=>
  document.getElementById(id).addEventListener("input",render));
buildGrid(); render();
</script>
</body>
</html>
